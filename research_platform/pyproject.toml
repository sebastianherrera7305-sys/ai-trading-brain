[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-platform"
version = "0.1.0"
description = "Independent research framework: experiment registry, immutable dataset registry, config-driven runner, result storage, comparison engine, reproducibility."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
research = "research_platform.cli:main"

[tool.setuptools]
packages = ["research_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
